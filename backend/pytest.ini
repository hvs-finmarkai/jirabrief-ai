[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto

# The SQLAlchemy engine is a module-level singleton, so its asyncpg connections
# are bound to whichever event loop created them. Without one shared loop for
# the whole session, every DB test after the first fails with
# "cannot perform operation: another operation is in progress".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

filterwarnings =
    ignore::DeprecationWarning
