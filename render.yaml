# Render deployment for the JiraBrief AI backend.
#   render.com -> New -> Blueprint -> point at this repo.
#
# Secrets are deliberately marked `sync: false`: Render prompts for them in the
# dashboard instead of them living in git.
services:
  - type: web
    name: jirabrief-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production

      # Postgres (Supabase connection string, async driver).
      - key: DATABASE_URL
        sync: false

      # Supabase auth
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Encrypts stored Jira tokens. MUST be different from SUPABASE_JWT_SECRET.
      # Generate with: openssl rand -hex 32
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

      # Lock this to the real frontend origin before going live.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # AI. Leave ANTHROPIC_API_KEY unset to fall back to deterministic reports.
      - key: AI_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_EFFORT
        value: medium

      # Scheduler. Safe with multiple instances (due schedules are claimed with
      # row-level locks), but if you scale out and want only one worker running
      # jobs, set this false on the extra instances.
      - key: SCHEDULER_ENABLED
        value: "true"

      # Never enable in production - this is the SSRF guard.
      - key: ALLOW_PRIVATE_NETWORK_TARGETS
        value: "false"

      # Render terminates TLS at its own load balancer, so the app sees the
      # balancer as the peer. Without this every user shares one rate-limit
      # bucket. 1 = exactly one trusted proxy hop.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
